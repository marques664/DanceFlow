openapi: 3.0.3
info:
  title: DanceFlow API
  description: API for managing a dance school. Part of the DanceFlow system.
  version: 1.0.0
servers:
  - url: http://localhost:3333
    description: Local development server
paths:
  /auth/login:
    post:
      summary: User login
      description: Authenticates a user and returns a JSON Web Token (JWT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: admin@danceflow.com
                password:
                  type: string
                  example: admin123
              required:
                - email
                - password
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum: [ADMIN, TEACHER]
        '400':
          description: Invalid fields or input validation failed
        '401':
          description: Incorrect email or password

  /modalities:
    get:
      summary: List all active modalities
      description: Returns a list of all active dance modalities. Accessible by both Admin and Teacher.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A list of modalities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Modality'
        '401':
          description: Token missing or invalid
    post:
      summary: Create a new modality
      description: Creates a new dance modality. Accessible by Admin only.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Ballet Infantil
                description:
                  type: string
                  example: Aulas de ballet para crianças de 4 a 6 anos
              required:
                - name
      responses:
        '201':
          description: Modality created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modality'
        '400':
          description: Name is already in use or input validation failed
        '401':
          description: Token missing or invalid
        '403':
          description: Insufficient permissions (requires ADMIN)

  /modalities/{id}:
    get:
      summary: Get details of a modality
      description: Returns details of a specific modality by ID.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Modality found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modality'
        '401':
          description: Token missing or invalid
        '404':
          description: Modality not found
    put:
      summary: Update a modality
      description: Updates the name and/or description of a modality. Accessible by Admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Ballet Iniciante
                description:
                  type: string
                  example: Aulas para iniciantes de todas as idades
              required:
                - name
      responses:
        '200':
          description: Modality updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modality'
        '400':
          description: Name is already in use or validation failed
        '401':
          description: Token missing or invalid
        '403':
          description: Insufficient permissions (requires ADMIN)
        '404':
          description: Modality not found
    delete:
      summary: Inactivate a modality
      description: Performs a logical delete of a modality, changing its status to inactive. Accessible by Admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Modality successfully inactivated (no content)
        '401':
          description: Token missing or invalid
        '403':
          description: Insufficient permissions (requires ADMIN)
        '404':
          description: Modality not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Modality:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        schoolId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
