version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: danceflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: danceflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
